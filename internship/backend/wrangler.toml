name = "shopnow-internship-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# D1 binding — after you create the database, paste its ID here
# (or run: wrangler d1 create shopnow_internship  and copy the printed database_id)
[[d1_databases]]
binding = "DB"
database_name = "shopnow_internship"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ADMIN_TOKEN is a secret, not set here. Set it with:
#   wrangler secret put ADMIN_TOKEN
# or in the dashboard: Workers & Pages → your Worker → Settings → Variables → add secret ADMIN_TOKEN
