<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.D. Pharmaceuticals — TDS Calculator</title>
<style>
  :root{--navy:#142744;--navy-dark:#0a1830;--gold:#c9973f;--paper:#faf7f0;--card:#fff;--ink:#1c2430;--muted:#6b7280;--line:#e5e0d3;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  header{background:linear-gradient(145deg,var(--navy),var(--navy-dark));color:#f9f6ef;padding:38px 24px}
  .header-inner,.page{max-width:760px;margin:auto}
  .kicker{margin:0 0 9px;color:#e0b563;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
  h1{margin:0;font:400 clamp(29px,5vw,42px)/1.15 Georgia,"Times New Roman",serif}
  .sub{margin:10px 0 0;color:#c7cede;font-size:14px;line-height:1.5}
  .page{padding:28px 24px 48px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:25px;box-shadow:0 8px 24px rgba(20,39,68,.06)}
  label,.label{display:block;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:9px}
  .field-note{font-size:12px;color:var(--muted);font-weight:400}
  input[type=number]{width:100%;border:1px solid #cfc7b0;border-radius:8px;padding:12px 13px;font-size:18px;color:var(--ink);outline:none}
  input[type=number]:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,151,63,.15)}
  .group{margin-top:23px}
  .rates{display:flex;gap:10px;flex-wrap:wrap}
  .rate{border:1px solid #d8d0bc;border-radius:8px;padding:11px 14px;cursor:pointer;min-width:118px;color:var(--ink);font-size:14px}
  .rate:has(input:checked){border-color:var(--gold);background:#fbf5e9;color:var(--navy);font-weight:700}
  .rate input{margin:0 8px 0 0;accent-color:var(--navy)}
  button{margin-top:26px;width:100%;border:0;border-radius:8px;background:var(--navy);color:#fff;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer}
  button:hover{background:var(--navy-dark)}
  .results{display:none;margin-top:25px;border-top:1px solid var(--line);padding-top:22px}
  .results.show{display:block}
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .result{background:#f7f4ec;border-radius:10px;padding:16px}
  .result.primary{background:var(--navy);color:#fff}
  .result .name{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .result.primary .name{color:#c7cede}
  .amount{margin-top:7px;font:400 25px/1.1 Georgia,"Times New Roman",serif}
  .formula{margin:17px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
  .warning{display:none;margin:14px 0 0;color:#9c2c2c;font-size:13px}
  @media(max-width:480px){.result-grid{grid-template-columns:1fr}.card{padding:20px}.page{padding-inline:16px}}
</style>
</head>
<body>
<header><div class="header-inner">
  <p class="kicker">S.D. Pharmaceuticals</p>
  <h1>TDS Calculator</h1>
  <p class="sub">Calculate TDS and the amount payable to a supplier from a GST-inclusive bill.</p>
</div></header>

<main class="page"><section class="card" aria-labelledby="bill-label">
  <label for="billAmount" id="bill-label">Final bill amount <span class="field-note">(including GST)</span></label>
  <input id="billAmount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 112000" autofocus>

  <div class="group">
    <span class="label">GST rate</span>
    <div class="rates">
      <label class="rate"><input type="radio" name="gstRate" value="5" checked>5% GST</label>
      <label class="rate"><input type="radio" name="gstRate" value="12">12% GST</label>
    </div>
  </div>

  <button id="calculate" type="button">Calculate payable amount</button>
  <p class="warning" id="warning" role="alert">Enter a valid final bill amount.</p>

  <section class="results" id="results" aria-live="polite">
    <div class="result-grid">
      <div class="result"><div class="name">Taxable amount</div><div class="amount" id="taxableAmount">₹0.00</div></div>
      <div class="result"><div class="name">TDS at 0.1%</div><div class="amount" id="tdsAmount">₹0.00</div></div>
      <div class="result primary" style="grid-column:1 / -1"><div class="name">Final payable to supplier</div><div class="amount" id="payableAmount">₹0.00</div></div>
    </div>
    <p class="formula" id="formula"></p>
  </section>
</section></main>

<script>
  const formatMoney = value => new Intl.NumberFormat('en-IN', {style:'currency', currency:'INR', minimumFractionDigits:2, maximumFractionDigits:2}).format(value);
  const billInput = document.getElementById('billAmount');
  function calculate(){
    const finalBill = Number(billInput.value);
    const warning = document.getElementById('warning');
    if (!Number.isFinite(finalBill) || finalBill <= 0) {
      document.getElementById('results').classList.remove('show');
      warning.style.display = 'block';
      billInput.focus();
      return;
    }
    warning.style.display = 'none';
    const gstRate = Number(document.querySelector('input[name="gstRate"]:checked').value);
    const taxable = finalBill / (1 + gstRate / 100);
    const tds = taxable * 0.001;
    const payable = finalBill - tds;
    document.getElementById('taxableAmount').textContent = formatMoney(taxable);
    document.getElementById('tdsAmount').textContent = formatMoney(tds);
    document.getElementById('payableAmount').textContent = formatMoney(payable);
    document.getElementById('formula').textContent = `Taxable amount = final bill ÷ 1.${String(gstRate).padStart(2, '0')}; TDS = 0.1% of taxable amount; final payable = final bill − TDS.`;
    document.getElementById('results').classList.add('show');
  }
  document.getElementById('calculate').addEventListener('click', calculate);
  billInput.addEventListener('keydown', event => { if (event.key === 'Enter') calculate(); });
  document.querySelectorAll('input[name="gstRate"]').forEach(input => input.addEventListener('change', () => {
    if (billInput.value) calculate();
  }));
</script>
</body>
</html>
